name: Release

# Push a version tag and this builds the Windows app and publishes it on the
# repository's Releases page:
#
#     echo 1.1.0 > VERSION && git commit -am "Release 1.1.0"
#     git tag v1.1.0 && git push --follow-tags
#
# The Windows downloads are unsigned, so SmartScreen may flag them.
#
# macOS is on hold for now. The PyInstaller spec already builds a .app on a
# Mac; to bring it back, add a macos-latest entry to the matrix below with a
# "Package (macOS)" step that ad-hoc signs the .app (codesign --sign -) and
# packs it with hdiutil into a .dmg.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pymupdf>=1.24" "fonttools>=4.40" pytest
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PDF-Watermark-Windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "v$(cat VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($(cat VERSION))" >&2
            exit 1
          fi

      - name: Stamp the version into the Windows file properties
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V=$(cat VERSION); T=$(echo "$V" | tr . ,)
          sed -i "s/(1, 0, 0, 0)/($T, 0)/g; s/'1\.0\.0'/'$V'/g" packaging/version_info.txt

      - run: pip install -r requirements.txt "pyinstaller>=6.5"
      - run: pyinstaller packaging/pdf-watermark.spec --noconfirm

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler "/DAppVersion=$version" 'packaging\pdf-watermark.iss'

      - name: Verify Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/test-installer.ps1

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv "dist/PDF Watermark.exe" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/PDF-Watermark-Setup.exe
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets && sha256sum * > SHA256SUMS.txt && cd ..
          cat > notes.md <<'NOTES'
          Choose a Windows 10 or 11 download from the release assets:

          - **Installer** `PDF-Watermark-Setup.exe`. Installs for your Windows account, adds a Start menu shortcut, and registers **PDF Watermark** in Settings → Apps and Control Panel → Programs and Features.
          - **Portable** `PDF-Watermark-Windows.exe`. Open the file directly and delete it when you no longer need it.

          GitHub Actions built both downloads from this repository. Windows SmartScreen may flag the unsigned files. See `SHA256SUMS.txt` in the assets for checksums and the [README](https://github.com/FZ-Labz/pdf-watermark#-privacy-and-uninstalling) for uninstall and settings details.
          NOTES
          gh release create "$GITHUB_REF_NAME" assets/* --title "PDF Watermark $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
