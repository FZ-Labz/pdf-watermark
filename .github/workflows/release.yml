name: Release

# Builds the Windows app, packs it with Velopack (an installer plus update
# packages) and publishes it on the repository's Releases page, where
# installed copies find their updates and offer them with "Update now".
#
# It runs by itself whenever a merge into main changes the app (the paths
# below). Website, README, docs and test-only changes don't ship an update.
# The version is the newest vX.Y.Z tag with the patch number raised by one
# (1.2.0 -> 1.2.1), unless VERSION says something higher: raise VERSION to
# 1.3.0 or 2.0.0 in a pull request for a bigger step. The workflow tags the
# merged commit itself, so there is nothing to tag by hand.
#
# Pushing a tag such as v1.4.0 still releases that exact version, and
# "Run workflow" on the Actions tab releases main as the next version.
#
# The build is not code-signed, so Windows SmartScreen asks once before the
# first launch; the README walks people through it.
#
# macOS is on hold for now. The PyInstaller spec already builds a .app on a
# Mac; to bring it back, add a macos-latest job with a step that ad-hoc signs the .app (codesign --sign -) and
# packs it with hdiutil into a .dmg.
on:
  push:
    branches: [main]
    # GitHub ignores these for tag pushes, so a pushed tag always releases.
    paths:
      - "*.py"
      - "ui/**"
      - "packaging/**"
      - "requirements.txt"
      - "VERSION"
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so two quick merges can't both claim the same number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Keep in step with the velopack package in requirements.txt.
  VPK_VERSION: "1.2.161"
  PACK_ID: PDFWatermark

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pymupdf>=1.24" "fonttools>=4.40" pytest
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every tag, to work out the next version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # Writes the version into VERSION for the rest of the build (the file is
      # not committed back; the tag records it).
      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            LAST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST:-0.0.0}"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
            FLOOR=$(tr -d '[:space:]' < VERSION)
            V=$(printf '%s\n%s\n' "$NEXT" "$FLOOR" | sort -V | tail -1)
            echo "Last release ${LAST:-none}, VERSION $FLOOR -> releasing $V"
          fi
          echo "$V" > VERSION
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the Windows file properties
        shell: bash
        run: |
          V=$(cat VERSION); T=$(echo "$V" | tr . ,)
          sed -i "s/(1, 0, 0, 0)/($T, 0)/g; s/'1\.0\.0'/'$V'/g" packaging/version_info.txt

      - run: pip install -r requirements.txt "pyinstaller>=6.5"
      - run: pyinstaller packaging/pdf-watermark.spec --noconfirm
      - run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # The previous release, so vpk can build a small delta update from it.
      # Fails harmlessly when there is no Velopack release yet.
      - name: Fetch the previous release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" -o releases || true

      - name: Pack with Velopack
        shell: bash
        run: |
          vpk pack --packId "$PACK_ID" --packVersion "$(cat VERSION)" \
            --packDir "dist/PDF Watermark" --mainExe "PDF Watermark.exe" \
            --packTitle "PDF Watermark" --packAuthors "FZ Labz" \
            --icon packaging/icon.ico --outputDir releases             --framework webview2
          # A friendlier name for the file people download. vpk upload still
          # wants its own name, so keep both until the release is published.
          cp "releases/$PACK_ID-win-Setup.exe" releases/PDF-Watermark-Setup.exe
          ls -la releases

      # Install with the real Setup.exe, as a user would, and open the
      # installed app in self-test mode. Nothing is published unless it
      # installs and its window comes up working.
      - name: Install and self-test
        shell: pwsh
        run: |
          $setup = Start-Process releases/PDF-Watermark-Setup.exe -ArgumentList '--silent' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup.exe failed with exit code $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\PDFWatermark\current\PDF Watermark.exe"
          if (-not (Test-Path $app)) { throw "The app was not installed" }
          $run = Start-Process $app -ArgumentList '--self-test','--no-update' -Wait -PassThru
          Get-Content "$env:APPDATA\PDF Watermark\app.log" -Tail 20
          if ($run.ExitCode -ne 0) { throw "The installed app failed its self-test" }

      # Exercise the real updater with a local feed and a separate package ID.
      - name: Test an installed Windows upgrade
        timeout-minutes: 12
        run: |
          npm ci --prefix tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/windows_upgrade.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: velopack-release
          path: releases/
          if-no-files-found: error

      # A tag pushed by this workflow's own token doesn't start another run.
      - name: Tag the release
        if: startsWith(github.ref, 'refs/heads/main')
        shell: bash
        run: |
          git tag "v${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          **Download** `PDF-Watermark-Setup.exe` below and double-click it. It installs in a few seconds, with no admin rights, and adds the app to the Start menu. After that the app updates itself: when a new version is out it offers to install it.

          The first time, Windows may show *"Windows protected your PC"*: click **More info**, then **Run anyway**.

          The other files (`.nupkg`, `releases.win.json`, `RELEASES`) are what installed copies use to update; you don't need them.
          Built by GitHub Actions directly from this repository. See the [privacy policy](https://github.com/FZ-Labz/pdf-watermark#-privacy-and-uninstalling).
          NOTES
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" \
            --outputDir releases --publish --tag "$TAG" \
            --releaseName "PDF Watermark $TAG"
          gh release edit "$TAG" --notes-file notes.md
          gh release delete-asset "$TAG" "$PACK_ID-win-Setup.exe" --yes
          gh release upload "$TAG" releases/PDF-Watermark-Setup.exe
