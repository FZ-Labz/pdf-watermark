name: Release

# Push a version tag and this builds the Windows app, packs it with Velopack
# (an installer plus update packages) and publishes it on the repository's
# Releases page, where installed copies find their updates:
#
#     echo 1.1.0 > VERSION && git commit -am "Release 1.1.0"
#     git tag v1.1.0 && git push --follow-tags
#
# The build is not code-signed, so Windows SmartScreen asks once before the
# first launch; the README walks people through it.
#
# macOS is on hold for now. The PyInstaller spec already builds a .app on a
# Mac; to bring it back, add a macos-latest job with a step that ad-hoc signs the .app (codesign --sign -) and
# packs it with hdiutil into a .dmg.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with the velopack package in requirements.txt.
  VPK_VERSION: "1.2.161"
  PACK_ID: PDFWatermark

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pymupdf>=1.24" "fonttools>=4.40" pytest
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "v$(cat VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($(cat VERSION))" >&2
            exit 1
          fi

      - name: Stamp the version into the Windows file properties
        shell: bash
        run: |
          V=$(cat VERSION); T=$(echo "$V" | tr . ,)
          sed -i "s/(1, 0, 0, 0)/($T, 0)/g; s/'1\.0\.0'/'$V'/g" packaging/version_info.txt

      - run: pip install -r requirements.txt "pyinstaller>=6.5"
      - run: pyinstaller packaging/pdf-watermark.spec --noconfirm
      - run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # The previous release, so vpk can build a small delta update from it.
      # Fails harmlessly when there is no Velopack release yet.
      - name: Fetch the previous release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" -o releases || true

      - name: Pack with Velopack
        shell: bash
        run: |
          vpk pack --packId "$PACK_ID" --packVersion "$(cat VERSION)" \
            --packDir "dist/PDF Watermark" --mainExe "PDF Watermark.exe" \
            --packTitle "PDF Watermark" --packAuthors "FZ Labz" \
            --icon packaging/icon.ico --outputDir releases             --framework webview2
          # A friendlier name for the file people download.
          mv "releases/$PACK_ID-win-Setup.exe" releases/PDF-Watermark-Setup.exe
          ls -la releases

      # Install with the real Setup.exe, as a user would, and open the
      # installed app in self-test mode. Nothing is published unless it
      # installs and its window comes up working.
      - name: Install and self-test
        shell: pwsh
        run: |
          $setup = Start-Process releases/PDF-Watermark-Setup.exe -ArgumentList '--silent' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup.exe failed with exit code $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\PDFWatermark\current\PDF Watermark.exe"
          if (-not (Test-Path $app)) { throw "The app was not installed" }
          $run = Start-Process $app -ArgumentList '--self-test','--no-update' -Wait -PassThru
          Get-Content "$env:APPDATA\PDF Watermark\app.log" -Tail 20
          if ($run.ExitCode -ne 0) { throw "The installed app failed its self-test" }

      - uses: actions/upload-artifact@v4
        with:
          name: velopack-release
          path: releases/
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Download** `PDF-Watermark-Setup.exe` below and double-click it. It installs in a few seconds, with no admin rights, and adds the app to the Start menu. After that the app updates itself: when a new version is out it offers to install it.

          The first time, Windows may show *"Windows protected your PC"*: click **More info**, then **Run anyway**.

          The other files (`.nupkg`, `releases.win.json`, `RELEASES`) are what installed copies use to update; you don't need them.
          Built by GitHub Actions directly from this repository. See the [privacy policy](https://github.com/FZ-Labz/pdf-watermark#-privacy-and-uninstalling).
          NOTES
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" \
            --outputDir releases --publish --tag "$GITHUB_REF_NAME" \
            --releaseName "PDF Watermark $GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
